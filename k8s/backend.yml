apiVersion: apps/v1
kind: Deployment
metadata:
  name: clicker-backend
  namespace: clicker-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clicker-backend
  template:
    metadata:
      labels:
        app: clicker-backend
    spec:
      containers:
        - name: backend
          image: manndshelby/clicker-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clicker-backend-service
  namespace: clicker-app
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: clicker-backend