name: CI

on:
  push:
    branches: [main]
    # chart/infra-only changes need no new image: Argo CD syncs them straight from git
    paths-ignore: ["charts/**", "infra/**", "argocd/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write # lets the job commit the new image tag back to the repo

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
     
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Set Image Tag
        id: vars
        run: echo "tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

    
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clicker-backend:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/clicker-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clicker-frontend:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/clicker-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api

      # GitOps hand-off: write the new tag into the Helm values and push.
      # Argo CD sees the commit and rolls the Deployments; no kubectl access needed in CI.
      - name: Bump image tags in Helm values
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          yq -i '.backend.image.tag = strenv(TAG) | .frontend.image.tag = strenv(TAG)' charts/clicker/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): images ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main