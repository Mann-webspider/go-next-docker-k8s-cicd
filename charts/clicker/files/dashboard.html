<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clicker Ops Canvas</title>
<script src="config.js"></script>
<style>
  :root {
    --bg: #0d0e10;
    --dot: #2b2e34;
    --frame: rgba(255,255,255,.025);
    --frame-line: #23262c;
    --card: #16181c;
    --card-2: #1c1f24;
    --line: #2a2d33;
    --text: #e7e9ee;
    --muted: #8b909a;
    --faint: #5d626c;
    --ok: #3ccf8e;
    --warn: #f5a524;
    --bad: #f0525c;
    --info: #5b9bff;
    --violet: #a78bfa;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); }
  #viewport {
    position: fixed; inset: 0; cursor: grab; touch-action: none;
    background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.3px);
  }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke: #3a3e46; stroke-width: 1.5; }
  #edges path.live { stroke: var(--info); stroke-dasharray: 6 6; animation: flow .9s linear infinite; }
  #edges path.fail { stroke: var(--bad); stroke-dasharray: 3 5; }
  @keyframes flow { to { stroke-dashoffset: -12; } }

  .frame { position: absolute; border: 1px dashed var(--frame-line); border-radius: 16px; background: var(--frame); pointer-events: none; }
  .frame > span { position: absolute; top: -22px; left: 4px; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

  .card {
    position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -12px rgba(0,0,0,.6);
    cursor: default;
  }
  .card.dragging { box-shadow: 0 0 0 1px var(--info), 0 20px 40px -10px rgba(0,0,0,.7); z-index: 10; }
  .card header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: move; user-select: none; }
  .card header .ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 700 11px var(--mono); color: #0d0e10; flex: none; }
  .card header h3 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card header a { color: var(--muted); text-decoration: none; font-size: 11px; }
  .card header a:hover { color: var(--text); }
  .card .body { padding: 10px 12px 12px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 99px; font: 600 10.5px var(--sans); background: var(--card-2); color: var(--muted); white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.info { color: var(--info); }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--card-2); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  .kpi b { display: block; font: 600 17px var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi small { color: var(--muted); font-size: 10.5px; }
  .spark { display: block; width: 100%; height: 44px; margin-top: 8px; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .mono { font-family: var(--mono); font-size: 11.5px; }

  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: center; min-width: 0; }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .row .dot.ok { background: var(--ok); box-shadow: 0 0 8px -1px var(--ok); }
  .row .dot.warn { background: var(--warn); } .row .dot.bad { background: var(--bad); box-shadow: 0 0 8px -1px var(--bad); }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
  .bar { height: 3px; border-radius: 2px; background: var(--card-2); margin: 2px 0 2px 16px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--info); }


  button.act { font: 600 12px var(--sans); color: #fff; background: #4f46e5; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button.act:hover { background: #6366f1; } button.act.ghost { background: var(--card-2); color: var(--text); }
  button.act:active { transform: translateY(1px); }

  #hud { position: fixed; top: 14px; left: 14px; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; z-index: 20; }
  #hud h1 { margin: 0; font-size: 13px; font-weight: 600; }
  #hud .sep { width: 1px; height: 16px; background: var(--line); }
  #tools { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px; z-index: 20; }
  #tools button { background: none; border: 0; color: var(--text); font: 600 12px var(--sans); padding: 7px 10px; border-radius: 7px; cursor: pointer; }
  #tools button:hover { background: var(--card-2); }
  #tools .z { min-width: 52px; text-align: center; color: var(--muted); font: 12px var(--mono); }
  #hint { position: fixed; bottom: 22px; right: 16px; color: var(--faint); font-size: 11px; z-index: 20; }
  @media (max-width: 700px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="edges"></svg></div></div>

<div id="hud">
  <h1>clicker · ops canvas</h1>
  <span class="sep"></span>
  <span id="src-prom" class="pill">prometheus</span>
  <span id="src-gh" class="pill">github</span>
  <span class="sep"></span>
  <span id="updated" class="muted mono">—</span>
</div>
<div id="tools">
  <button id="z-out" title="Zoom out">−</button>
  <span id="z-val" class="z">100%</span>
  <button id="z-in" title="Zoom in">+</button>
  <button id="z-fit" title="Fit everything (F)">Fit</button>
  <button id="z-reset" title="Restore default card layout">Reset layout</button>
</div>
<div id="hint">drag canvas to pan · wheel to zoom · drag card headers to move</div>

<script>
"use strict";
const CFG = window.CFG || { repo: "", links: {} };
const NS = "clicker-app";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- canvas: pan / zoom ---------- */
const vp = $("#viewport"), world = $("#world"), edgesSvg = $("#edges");
const view = { x: 60, y: 90, z: 0.8 };
function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
  const g = 22 * view.z;
  vp.style.backgroundSize = `${g}px ${g}px`;
  vp.style.backgroundPosition = `${view.x}px ${view.y}px`;
  $("#z-val").textContent = Math.round(view.z * 100) + "%";
}
function zoomAt(factor, cx, cy) {
  const z = Math.min(2.5, Math.max(0.2, view.z * factor));
  view.x = cx - (cx - view.x) * (z / view.z);
  view.y = cy - (cy - view.y) * (z / view.z);
  view.z = z; applyView();
}
vp.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
}, { passive: false });

let pan = null;
vp.addEventListener("pointerdown", e => {
  if (e.target.closest(".card")) return;
  pan = { sx: e.clientX, sy: e.clientY, x: view.x, y: view.y };
  vp.classList.add("panning"); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove", e => {
  if (!pan) return;
  view.x = pan.x + e.clientX - pan.sx; view.y = pan.y + e.clientY - pan.sy; applyView();
});
vp.addEventListener("pointerup", () => { pan = null; vp.classList.remove("panning"); });

$("#z-in").onclick = () => zoomAt(1.2, innerWidth / 2, innerHeight / 2);
$("#z-out").onclick = () => zoomAt(1 / 1.2, innerWidth / 2, innerHeight / 2);
$("#z-fit").onclick = fit;
$("#z-reset").onclick = () => { try { localStorage.removeItem("canvas-layout"); } catch {} CARDS.forEach(c => { c.x = c.dx; c.y = c.dy; place(c); }); layoutChanged(); fit(); };
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea")) return;
  if (e.key === "f" || e.key === "F") fit();
  if (e.key === "+" || e.key === "=") $("#z-in").click();
  if (e.key === "-") $("#z-out").click();
});
function fit() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  CARDS.forEach(c => { x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y); x1 = Math.max(x1, c.x + c.w); y1 = Math.max(y1, c.y + c.el.offsetHeight); });
  const pad = 70, W = innerWidth, H = innerHeight - 60;
  // clamp: the page can load inside a hidden/zero-size frame
  view.z = Math.max(0.2, Math.min(1.2, (W - pad * 2) / (x1 - x0), (H - pad * 2) / (y1 - y0)));
  view.x = (W - (x1 - x0) * view.z) / 2 - x0 * view.z;
  view.y = 50 + (H - (y1 - y0) * view.z) / 2 - y0 * view.z;
  applyView();
}

/* ---------- cards, frames, edges ---------- */
// x/y are world coordinates; frames auto-wrap their member cards.
const CARDS = [
  { id: "git",     frame: "pipeline", x: 0,    y: 0,   w: 300, ico: "GH", col: "#e7e9ee", title: "GitHub · commits", link: () => `https://github.com/${CFG.repo}` },
  { id: "ci",      frame: "pipeline", x: 350,  y: 0,   w: 300, ico: "CI", col: "#5b9bff", title: "GitHub Actions", link: () => `https://github.com/${CFG.repo}/actions` },
  { id: "argo",    frame: "pipeline", x: 700,  y: 0,   w: 330, ico: "AR", col: "#f2865e", title: "Argo CD", link: () => CFG.links.argocd },

  { id: "user",    frame: "runtime",  x: 0,    y: 380, w: 260, ico: "▶", col: "#a78bfa", title: "Traffic generator", link: () => CFG.links.app },
  { id: "front",   frame: "runtime",  x: 330,  y: 330, w: 300, ico: "FE", col: "#e7e9ee", title: "Frontend · Next.js" },
  { id: "back",    frame: "runtime",  x: 330,  y: 540, w: 300, ico: "BE", col: "#00add8", title: "Backend · Go API" },
  { id: "pg",      frame: "runtime",  x: 700,  y: 540, w: 260, ico: "PG", col: "#6b9eda", title: "PostgreSQL" },

  { id: "prom",    frame: "observe",  x: 1120, y: 0,   w: 320, ico: "PR", col: "#f5a524", title: "Prometheus", link: () => CFG.links.prometheus },
  { id: "grafana", frame: "observe",  x: 1480, y: 0,   w: 260, ico: "GF", col: "#f5a524", title: "Grafana", link: () => CFG.links.grafana },

  { id: "node",    frame: "platform", x: 0,    y: 900, w: 300, ico: "K8", col: "#5b9bff", title: "Cluster node" },
  { id: "p-argo",  frame: "platform", x: 350,  y: 900, w: 320, ico: "AR", col: "#f2865e", title: "argocd namespace" },
  { id: "p-mon",   frame: "platform", x: 720,  y: 900, w: 340, ico: "MO", col: "#f5a524", title: "monitoring namespace" },
];
const FRAMES = { pipeline: "Delivery pipeline · GitOps", runtime: "Runtime · clicker-app", observe: "Observability", platform: "Platform pods · each server report" };
// [from, to, key] — key picks the signal that makes the edge animate (see edgeState)
const EDGES = [
  ["git", "ci", "ci"], ["ci", "argo", "ci"], ["argo", "front", "argo"], ["argo", "back", "argo"],
  ["user", "front", "rps"], ["user", "back", "rps"], ["front", "back", "rps"], ["back", "pg", "rps"],
  ["back", "prom", "scrape"], ["prom", "grafana", "scrape"],
];

let saved = {};
try { saved = JSON.parse(localStorage.getItem("canvas-layout") || "{}"); } catch {}
const frameEls = {};
for (const [k, label] of Object.entries(FRAMES)) {
  const f = document.createElement("div"); f.className = "frame"; f.innerHTML = `<span>${label}</span>`;
  world.insertBefore(f, edgesSvg); frameEls[k] = f;
}
for (const c of CARDS) {
  c.dx = c.x; c.dy = c.y;
  if (saved[c.id]) Object.assign(c, saved[c.id]);
  const el = c.el = document.createElement("section");
  el.className = "card"; el.style.width = c.w + "px";
  el.innerHTML = `<header><span class="ico" style="background:${c.col}">${c.ico}</span><h3>${c.title}</h3>
    <span class="st"></span>${c.link ? `<a target="_blank" rel="noopener" href="#">open ↗</a>` : ""}</header><div class="body"><span class="faint">loading…</span></div>`;
  if (c.link) el.querySelector("a").href = c.link() || "#";
  c.body = el.querySelector(".body"); c.st = el.querySelector(".st");
  world.appendChild(el); place(c); dragCard(c);
}
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
function place(c) { c.el.style.left = c.x + "px"; c.el.style.top = c.y + "px"; }

function dragCard(c) {
  const h = c.el.querySelector("header");
  let d = null;
  h.addEventListener("pointerdown", e => {
    if (e.target.closest("a")) return;
    d = { sx: e.clientX, sy: e.clientY, x: c.x, y: c.y };
    h.setPointerCapture(e.pointerId); c.el.classList.add("dragging");
  });
  h.addEventListener("pointermove", e => {
    if (!d) return;
    c.x = Math.round(d.x + (e.clientX - d.sx) / view.z); c.y = Math.round(d.y + (e.clientY - d.sy) / view.z);
    place(c); layoutChanged();
  });
  h.addEventListener("pointerup", () => {
    if (!d) return; d = null; c.el.classList.remove("dragging");
    try { localStorage.setItem("canvas-layout", JSON.stringify(Object.fromEntries(CARDS.map(k => [k.id, { x: k.x, y: k.y }])))); } catch {}
  });
}

function layoutChanged() { drawFrames(); drawEdges(); }
function drawFrames() {
  for (const [k, f] of Object.entries(frameEls)) {
    const m = CARDS.filter(c => c.frame === k);
    const x0 = Math.min(...m.map(c => c.x)) - 24, y0 = Math.min(...m.map(c => c.y)) - 24;
    const x1 = Math.max(...m.map(c => c.x + c.w)) + 24, y1 = Math.max(...m.map(c => c.y + c.el.offsetHeight)) + 24;
    Object.assign(f.style, { left: x0 + "px", top: y0 + "px", width: x1 - x0 + "px", height: y1 - y0 + "px" });
  }
}
function drawEdges() {
  edgesSvg.innerHTML = EDGES.map(([a, b, key]) => {
    const A = byId[a], B = byId[b], ah = A.el.offsetHeight, bh = B.el.offsetHeight;
    // leave from whichever side faces the target
    const right = B.x >= A.x + A.w / 2;
    const x1 = right ? A.x + A.w : A.x, y1 = A.y + ah / 2;
    let x2 = right ? B.x : B.x + B.w, y2 = B.y + bh / 2;
    let path;
    if (Math.abs(B.x - A.x) < 40) { // stacked vertically: connect bottom → top
      const down = B.y > A.y;
      const sx = A.x + A.w / 2, sy = down ? A.y + ah : A.y, ex = B.x + B.w / 2, ey = down ? B.y : B.y + bh;
      path = `M${sx},${sy} C${sx},${(sy + ey) / 2} ${ex},${(sy + ey) / 2} ${ex},${ey}`;
    } else {
      const dx = Math.max(40, Math.abs(x2 - x1) / 2) * (right ? 1 : -1);
      path = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    }
    return `<path class="${edgeState(key)}" d="${path}"/>`;
  }).join("");
}

/* ---------- data ---------- */
const S = {}; // latest snapshot
async function getJSON(url, ms = 6000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const prom = async q => (await getJSON("/api/prom/api/v1/query?query=" + encodeURIComponent(q))).data.result;
async function promRange(q, mins = 15, step = 20) {
  const end = Date.now() / 1000;
  const r = await getJSON(`/api/prom/api/v1/query_range?query=${encodeURIComponent(q)}&start=${end - mins * 60}&end=${end}&step=${step}`);
  return (r.data.result[0]?.values || []).map(v => +v[1]);
}
const val = r => (r && r[0] ? +r[0].value[1] : NaN);

async function refreshProm() {
  const sel = `namespace=~"${NS}|argocd|monitoring"`;
  const [info, ready, phase, restarts, cpu, mem, rpsPod, rps, p95, clicks, apps, up, upAll, nodeCpu, nodeMem, images, rpsSeries, p95Series] = await Promise.all([
    prom(`kube_pod_info{${sel}}`),
    prom(`kube_pod_status_ready{${sel},condition="true"}`),
    prom(`kube_pod_status_phase{${sel}} == 1`),
    prom(`sum by (namespace,pod)(kube_pod_container_status_restarts_total{${sel}})`),
    prom(`sum by (namespace,pod)(rate(container_cpu_usage_seconds_total{${sel},container!=""}[2m]))`),
    prom(`sum by (namespace,pod)(container_memory_working_set_bytes{${sel},container!=""})`),
    prom(`sum by (pod)(rate(http_requests_total{namespace="${NS}"}[1m]))`),
    prom(`sum(rate(http_requests_total{namespace="${NS}"}[1m]))`),
    prom(`histogram_quantile(0.95, sum by (le)(rate(http_request_duration_seconds_bucket{namespace="${NS}"}[5m])))`),
    prom(`sum(increase(clicker_clicks_total{namespace="${NS}"}[15m]))`),
    prom(`argocd_app_info`),
    prom(`count(up == 1)`), prom(`count(up)`),
    prom(`1 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m]))`),
    prom(`1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)`),
    prom(`kube_pod_container_info{namespace="${NS}"}`),
    promRange(`sum(rate(http_requests_total{namespace="${NS}"}[1m]))`),
    promRange(`histogram_quantile(0.95, sum by (le)(rate(http_request_duration_seconds_bucket{namespace="${NS}"}[2m])))`),
  ]);
  const key = m => m.namespace + "/" + m.pod;
  const idx = (rs, f = r => +r.value[1]) => Object.fromEntries(rs.map(r => [key(r.metric), f(r)]));
  const R = idx(ready), RS = idx(restarts), C = idx(cpu), M = idx(mem), PH = idx(phase, r => r.metric.phase);
  const RP = Object.fromEntries(rpsPod.map(r => [r.metric.pod, +r.value[1]]));
  const IMG = {}; images.forEach(r => IMG[r.metric.container] = r.metric.image);
  S.pods = info.map(r => {
    const k = key(r.metric);
    return { ns: r.metric.namespace, name: r.metric.pod, ready: R[k] === 1, phase: PH[k] || "?", restarts: RS[k] || 0, cpu: C[k] || 0, mem: M[k] || 0, rps: RP[r.metric.pod] };
  }).sort((a, b) => a.name.localeCompare(b.name));
  Object.assign(S, {
    rps: val(rps), p95: val(p95), clicks15: val(clicks),
    apps: apps.map(r => r.metric), up: val(up), upAll: val(upAll), nodeCpu: val(nodeCpu), nodeMem: val(nodeMem),
    images: IMG, rpsSeries, p95Series,
  });
}

let ghNext = 0;
async function refreshGitHub() {
  if (!CFG.repo || Date.now() < ghNext) return;
  ghNext = Date.now() + 120e3; // unauthenticated API allows 60 req/h per IP
  const [commits, runs] = await Promise.all([
    getJSON(`https://api.github.com/repos/${CFG.repo}/commits?per_page=5`),
    getJSON(`https://api.github.com/repos/${CFG.repo}/actions/runs?per_page=5`),
  ]);
  S.commits = commits; S.runs = runs.workflow_runs || [];
}

/* ---------- render helpers ---------- */
const fmtB = b => !isFinite(b) ? "—" : b > 1 << 30 ? (b / (1 << 30)).toFixed(1) + " GiB" : (b / (1 << 20)).toFixed(0) + " MiB";
const fmtPct = v => isFinite(v) ? (v * 100).toFixed(0) + "%" : "—";
const fmtN = (v, d = 1) => isFinite(v) ? (+v).toFixed(d) : "—";
const ago = t => { const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? Math.floor(s) + "s ago" : s < 3600 ? Math.floor(s / 60) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : Math.floor(s / 86400) + "d ago"; };
const pill = (cls, txt) => `<span class="pill ${cls}">${esc(txt)}</span>`;
function spark(vals, color = "var(--info)") {
  const v = (vals || []).filter(isFinite);
  if (v.length < 2) return `<svg class="spark"></svg>`;
  const max = Math.max(...v, 1e-9), W = 280, H = 44;
  const pts = v.map((y, i) => `${(i / (v.length - 1)) * W},${H - 2 - (y / max) * (H - 6)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
const podDot = p => p.ready ? "ok" : p.phase === "Pending" ? "warn" : p.phase === "Succeeded" ? "" : "bad";
function podRows(pods, maxMem = 256 << 20) {
  if (!pods.length) return `<span class="faint">no pods</span>`;
  return `<div class="rows">${pods.map(p => `
    <div><div class="row"><span class="dot ${podDot(p)}"></span><span class="name mono" title="${esc(p.name)}">${esc(p.name)}</span>
      <span class="meta">${p.rps !== undefined ? fmtN(p.rps, 2) + " r/s · " : ""}${fmtN(p.cpu * 1000, 0)}m · ${fmtB(p.mem)}${p.restarts ? ` · <span style="color:var(--warn)">↻${p.restarts}</span>` : ""}</span></div>
      <div class="bar"><i style="width:${Math.min(100, (p.mem / maxMem) * 100)}%"></i></div></div>`).join("")}</div>`;
}
const health = pods => !pods.length ? pill("bad", "down") : pods.every(p => p.ready) ? pill("ok", `${pods.length}/${pods.length} ready`) : pill("warn", `${pods.filter(p => p.ready).length}/${pods.length} ready`);
const podsOf = (ns, prefix) => (S.pods || []).filter(p => p.ns === ns && (!prefix || p.name.startsWith(prefix)));
const tag = img => img ? esc(img.split(":").pop().slice(0, 12)) : "—";

function edgeState(key) {
  if (key === "rps") return S.rps > 0.01 ? "live" : "";
  if (key === "scrape") return S.up > 0 ? "live" : "";
  if (key === "ci") return (S.runs || []).some(r => r.status !== "completed") ? "live" : (S.runs || [])[0]?.conclusion === "failure" ? "fail" : "";
  if (key === "argo") return (S.apps || []).some(a => a.sync_status !== "Synced") ? "live" : "";
  return "";
}

/* ---------- card renderers ---------- */
const R = {
  git() {
    if (!S.commits) return [pill("", "…"), `<span class="faint">waiting for GitHub API</span>`];
    return [pill("info", S.commits[0]?.sha.slice(0, 7)), `<div class="rows">${S.commits.map(c => `
      <div class="row"><span class="dot ok"></span><span class="name" title="${esc(c.commit.message)}">${esc(c.commit.message.split("\n")[0])}</span>
      <span class="meta">${c.sha.slice(0, 7)} · ${ago(c.commit.author.date)}</span></div>`).join("")}</div>`];
  },
  ci() {
    if (!S.runs) return [pill("", "…"), `<span class="faint">waiting for GitHub API</span>`];
    const cls = r => r.status !== "completed" ? "warn" : r.conclusion === "success" ? "ok" : "bad";
    const l = S.runs[0];
    return [l ? pill(cls(l), l.status !== "completed" ? l.status : l.conclusion) : pill("", "no runs"), `<div class="rows">${S.runs.map(r => `
      <div class="row"><span class="dot ${cls(r)}"></span><span class="name">${esc(r.name)} <span class="faint">#${r.run_number}</span></span>
      <span class="meta">${r.head_sha.slice(0, 7)} · ${ago(r.created_at)}</span></div>`).join("")}</div>`];
  },
  argo() {
    const apps = S.apps || [];
    const c = s => s === "Synced" || s === "Healthy" ? "ok" : s === "Progressing" || s === "OutOfSync" ? "warn" : "bad";
    const st = !apps.length ? pill("bad", "no apps") : apps.every(a => a.sync_status === "Synced" && a.health_status === "Healthy") ? pill("ok", "synced") : pill("warn", "reconciling");
    return [st, `${apps.map(a => `<div class="row" style="margin-bottom:8px"><span class="dot ${c(a.health_status)}"></span>
      <span class="name"><b>${esc(a.name)}</b> <span class="faint">→ ${esc(a.dest_namespace)}</span></span>
      <span>${pill(c(a.sync_status), a.sync_status)} ${pill(c(a.health_status), a.health_status)}</span></div>`).join("") || `<span class="faint">argocd_app_info not scraped yet</span>`}
      <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><b class="mono" style="font-size:13px">${tag(S.images?.backend)}</b><small>backend image</small></div>
      <div class="kpi"><b class="mono" style="font-size:13px">${tag(S.images?.frontend)}</b><small>frontend image</small></div></div>`];
  },
  user() {
    return [pill(S.rps > 0.01 ? "info" : "", S.rps > 0.01 ? "traffic" : "idle"), `
      <div class="kpis" style="grid-template-columns:1fr 1fr;margin-bottom:10px"><div class="kpi"><b id="click-count">${S.count ?? "—"}</b><small>total clicks</small></div>
      <div class="kpi"><b class="mono" style="font-size:12px" id="click-pod">${esc(S.lastPod || "—")}</b><small>served by</small></div></div>
      <div style="display:flex;gap:8px"><button class="act" data-click="1">Push event</button><button class="act ghost" data-click="25">Burst ×25</button></div>`];
  },
  front() { const p = podsOf(NS, "clicker-frontend"); return [health(p), podRows(p, 128 << 20)]; },
  back() {
    const p = podsOf(NS, "clicker-backend");
    return [health(p), `<div class="kpis"><div class="kpi"><b>${fmtN(S.rps, 2)}</b><small>req/s</small></div>
      <div class="kpi"><b>${isFinite(S.p95) ? fmtN(S.p95 * 1000, 0) + "ms" : "—"}</b><small>p95 latency</small></div>
      <div class="kpi"><b>${fmtN(S.clicks15, 0)}</b><small>clicks / 15m</small></div></div>
      ${spark(S.rpsSeries)}<div style="height:8px"></div>${podRows(p, 64 << 20)}`];
  },
  pg() { const p = podsOf(NS, "postgres"); return [health(p), `<div class="muted" style="margin-bottom:8px">source of truth · StatefulSet + PVC</div>${podRows(p, 128 << 20)}`]; },
  prom() {
    const ok = S.up === S.upAll;
    return [pill(ok ? "ok" : "warn", `${S.up ?? "?"}/${S.upAll ?? "?"} targets up`), `
      <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><b>${isFinite(S.p95) ? fmtN(S.p95 * 1000, 1) : "—"}</b><small>p95 ms (15m)</small></div>
      <div class="kpi"><b>${fmtN(S.rps, 2)}</b><small>req/s</small></div></div>${spark(S.p95Series, "var(--warn)")}`];
  },
  grafana() {
    const p = podsOf("monitoring", "monitoring-grafana");
    return [health(p), `<div class="muted" style="margin-bottom:10px">Dashboards for cluster and pods.<br>login <span class="mono">admin / admin</span></div>
      <a class="act ghost" style="display:inline-block;text-decoration:none;padding:7px 10px;border-radius:8px;background:var(--card-2);color:var(--text)" target="_blank" rel="noopener" href="${esc(CFG.links.grafana)}">Open Grafana ↗</a>`];
  },
  node() {
    return [pill("ok", "kind"), `<div class="kpis" style="grid-template-columns:1fr 1fr 1fr"><div class="kpi"><b>${fmtPct(S.nodeCpu)}</b><small>cpu</small></div>
      <div class="kpi"><b>${fmtPct(S.nodeMem)}</b><small>memory</small></div><div class="kpi"><b>${(S.pods || []).length}</b><small>pods shown</small></div></div>`];
  },
  "p-argo"() { const p = podsOf("argocd"); return [health(p), podRows(p, 512 << 20)]; },
  "p-mon"() { const p = podsOf("monitoring"); return [health(p), podRows(p, 1 << 30)]; },
};

function render() {
  for (const c of CARDS) {
    try { const [st, html] = R[c.id](); c.st.innerHTML = st; c.body.innerHTML = html; }
    catch (e) { c.body.innerHTML = `<span class="faint">no data (${esc(e.message)})</span>`; }
  }
  layoutChanged();
}

function setSrc(id, ok) { $(id).className = "pill " + (ok ? "ok" : "bad"); }
async function tick() {
  const res = await Promise.allSettled([refreshProm(), refreshGitHub(), refreshCount()]);
  setSrc("#src-prom", res[0].status === "fulfilled");
  if (CFG.repo && (S.commits || res[1].status === "rejected")) setSrc("#src-gh", res[1].status === "fulfilled" || !!S.commits);
  $("#updated").textContent = "updated " + new Date().toLocaleTimeString();
  render();
}
async function refreshCount() { const r = await getJSON("/api/app/clicks"); S.count = r.count; }

/* traffic generator buttons */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-click]"); if (!b) return;
  const n = +b.dataset.click;
  b.disabled = true;
  try {
    for (let i = 0; i < n; i++) {
      const r = await fetch("/api/app/clicked", { method: "POST" }).then(r => r.json());
      S.count = r.count; S.lastPod = r.pod;
      const cc = $("#click-count"), cp = $("#click-pod");
      if (cc) cc.textContent = r.count; if (cp) cp.textContent = r.pod;
    }
  } catch (err) { console.error(err); }
  b.disabled = false;
});

applyView();
render();
requestAnimationFrame(() => { if (!Object.keys(saved).length) fit(); });
tick();
setInterval(tick, 5000);
addEventListener("resize", applyView);
</script>
</body>
</html>
