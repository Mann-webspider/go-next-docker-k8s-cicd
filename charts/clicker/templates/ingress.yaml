apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clicker-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # host-less rule: the app answers on http://localhost
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: clicker-backend-service
                port: { number: 8080 }
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: clicker-frontend-service
                port: { number: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clicker-dashboard
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.dashboard.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clicker-dashboard
                port: { number: 80 }
