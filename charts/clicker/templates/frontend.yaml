apiVersion: apps/v1
kind: Deployment
metadata:
  name: clicker-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: clicker-frontend
  template:
    metadata:
      labels:
        app: clicker-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clicker-frontend-service
spec:
  selector:
    app: clicker-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
